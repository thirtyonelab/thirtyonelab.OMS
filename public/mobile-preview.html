<!doctype html>
<html lang="ms">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview · ThirtyOne Lab</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; background: #e9e7e0; font: 14px system-ui, sans-serif; color: #595349; padding: 24px; }
  header { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  button, a { color: inherit; background: white; border: 1px solid #d4cec3; padding: 9px 12px; border-radius: 6px; font: inherit; text-decoration: none; cursor: pointer; }
  iframe { display: block; width: 390px; max-width: 100%; height: 844px; margin: auto; border: 1px solid #cbc5b8; border-radius: 20px; background: #f6f5f1; box-shadow: 0 20px 60px #39302417; }
</style>
<header><strong>Mobile preview</strong><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">Tablet</button><a href="/">Desktop</a></header>
<iframe title="ThirtyOne Lab mobile app" src="/"></iframe>
<script>document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => { document.querySelector('iframe').style.width = button.dataset.width + 'px'; }));</script>
</html>
