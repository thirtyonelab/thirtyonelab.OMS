<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/thirtyonelab.OMS/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Management System - ThirtyOne Lab</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = 'red';
        div.style.color = 'white';
        div.style.padding = '20px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.overflow = 'auto';
        div.innerHTML = '<h2>Global JS Error:</h2><pre>' + message + '\nLine: ' + lineno + ':' + colno + '\nSource: ' + source + '\n\n' + (error ? error.stack : '') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
      window.onunhandledrejection = function(event) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = 'darkred';
        div.style.color = 'white';
        div.style.padding = '20px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.overflow = 'auto';
        div.innerHTML = '<h2>Unhandled Rejection:</h2><pre>' + (event.reason ? event.reason.stack || event.reason : event) + '</pre>';
        document.body.appendChild(div);
      };
    </script>

</html>
